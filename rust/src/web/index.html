<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMstate policy sandbox</title>
</head>
<body>
    <h1>NMstate policy sandbox</h1>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/theme/dracula.css">
<div style="display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; flex-direction: row; gap: 20px; flex: 1;">
        <div style="flex: 1;">
            <label for="state">State:</label>
            <textarea id="state" name="state" style="width: 100%; height: 100%;"></textarea>
        </div>
        <div style="flex: 1;">
            <label for="policy">Policy:</label>
            <textarea id="policy" name="policy" style="width: 100%; height: 100%;"></textarea>
        </div>
    </div>
    </div>
    <div>
        <label for="expanded">Expanded:</label>
        <textarea id="expanded" name="expanded"></textarea>
    </div>
</div>
<script type="module" src="index.js"></script>
</script>
</body>
</html>
